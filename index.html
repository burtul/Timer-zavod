<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;font-family:Segoe UI,sans-serif;height:100vh;height:100dvh;width:100vw;position:relative;background:#87CEEB;-webkit-tap-highlight-color:transparent;user-select:none;cursor:default}
.sky{position:fixed;inset:0;background:linear-gradient(#87CEEB,#E0F7FA);transition:background 2s;z-index:1}
.city{position:fixed;bottom:0;left:0;width:100%;height:55%;z-index:2;pointer-events:none}
.city svg{width:100%;height:100%;display:block}
.tc{position:fixed;top:12%;left:50%;transform:translateX(-50%);text-align:center;z-index:10;background:rgba(0,0,0,.65);padding:18px 36px;border-radius:20px;backdrop-filter:blur(6px);box-shadow:0 10px 30px rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.15)}
.tl{font-size:15px;color:#ddd;margin-bottom:8px;text-transform:uppercase;letter-spacing:2px}
.tm{font-size:60px;font-weight:700;color:#fff;font-family:Courier New,monospace;text-shadow:0 0 20px rgba(255,255,255,.4);line-height:1;font-variant-numeric:tabular-nums}
.wk{position:fixed;bottom:3%;left:0;width:clamp(100px,15vw,150px);height:auto;z-index:5;transition:left .9s linear;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.wk svg{width:100%;height:auto;display:block}
.sm{position:fixed;bottom:52%;left:15%;width:20px;height:20px;background:rgba(200,200,200,.55);border-radius:50%;animation:s 4s infinite ease-out;z-index:3}
.sm:nth-child(2){left:45%;animation-delay:1s;width:25px;height:25px}
.sm:nth-child(3){left:75%;animation-delay:2s;width:15px;height:15px}
@keyframes s{0%{transform:translateY(0) scale(1);opacity:.6}100%{transform:translateY(-150px) scale(3);opacity:0}}
@media(max-width:768px){.tm{font-size:44px}.tc{padding:14px 26px;top:8%}.tl{font-size:13px}}
</style>
</head>

<script>
const START_DATE=new Date(2026,10,4,0,0,0),CYCLE=8,SHIFT_DAYS={0:{s:8,e:20},1:{s:8,e:20},4:{s:20,e:8,nd:true},5:{s:20,e:8,nd:true}},timerEl=document.getElementById('timer'),timerLabel=document.getElementById('timerLabel'),workerEl=document.getElementById('worker'),skyEl=document.getElementById('sky');
function getCycleDayIndex(d){const m=new Date(d.getFullYear(),d.getMonth(),d.getDate()),diff=Math.floor((m-START_DATE)/864e5);return((diff%CYCLE)+CYCLE)%CYCLE}
function getIntervals(idx,base){const si=SHIFT_DAYS[idx];if(!si)return[];const start=new Date(base);start.setHours(si.s,0,0,0);const end=new Date(base);if(si.nd)end.setDate(end.getDate()+1);end.setHours(si.e,0,0,0);return[{start,end}]}
function getShiftInfo(now){const idx=getCycleDayIndex(now),tm=new Date(now.getFullYear(),now.getMonth(),now.getDate()),ints=[];for(let o=-2;o<=9;o++){const b=new Date(tm);b.setDate(b.getDate()+o);const i=((idx+o)%CYCLE+CYCLE)%CYCLE;ints.push(...getIntervals(i,b))}ints.sort((a,b)=>a.start-b.start);for(const it of ints){if(now>=it.start&&now<it.end)return{isActive:true,timeLeft:(it.end-now)/1000,progress:(now-it.start)/(it.end-it.start),label:'До конца смены'}}for(const it of ints){if(it.start>now)return{isActive:false,timeLeft:(it.start-now)/1000,progress:0,label:'До начала смены'}}return{isActive:false,timeLeft:0,progress:0,label:'До начала смены'}}
function fmt(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=Math.floor(s%60);return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
function updWorker(p){const w=workerEl.offsetWidth,max=window.innerWidth-w;workerEl.style.left=Math.max(0,Math.min(max,p*max))+'px'}
function updSky(h){let g;if(h>=6&&h<12)g='linear-gradient(#87CEEB,#FFB347)';else if(h>=12&&h<18)g='linear-gradient(#87CEEB,#E0F7FA)';else if(h>=18&&h<22)g='linear-gradient(#FF7E5F,#2C3E50)';else g='linear-gradient(#0B0B2B,#1B1B3A)';skyEl.style.background=g}
function update(){const n=new Date(),i=getShiftInfo(n);timerEl.textContent=fmt(i.timeLeft);timerLabel.textContent=i.label;updWorker(i.progress);updSky(n.getHours())}
update();setInterval(update,1000);
window.addEventListener('resize',()=>{const i=getShiftInfo(new Date());updWorker(i.progress)});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}
</script>
