<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>До конца смены</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            width: 100vw;
            position: relative;
            background: #87CEEB;
            transition: background 2s ease;
        }

        .sky {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            transition: background 2s ease; z-index: 1;
        }

        .city {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 60%;
            z-index: 2; pointer-events: none;
        }
        .city svg { width: 100%; height: 100%; display: block; }

        .timer-container {
            position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
            text-align: center; z-index: 10;
            background: rgba(0, 0, 0, 0.6); padding: 20px 40px; border-radius: 20px;
            backdrop-filter: blur(5px); box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.2);
        }
        .timer-label {
            font-size: 18px; color: #ddd; margin-bottom: 10px;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .timer {
            font-size: 64px; font-weight: bold; color: #fff;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 20px rgba(255,255,255,0.5); line-height: 1;
        }

        .worker {
            position: absolute; bottom: 5%; left: 0; width: 100px; height: 150px;
            z-index: 5; transition: left 0.9s linear;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
        }
        .worker svg { width: 100%; height: 100%; }

        .smoke {
            position: absolute; bottom: 55%; left: 15%; width: 20px; height: 20px;
            background: rgba(200, 200, 200, 0.6); border-radius: 50%;
            animation: smoke 4s infinite ease-out; z-index: 3;
        }
        .smoke:nth-child(2) { left: 45%; animation-delay: 1s; width: 25px; height: 25px; }
        .smoke:nth-child(3) { left: 75%; animation-delay: 2s; width: 15px; height: 15px; }

        @keyframes smoke {
            0% { transform: translateY(0) scale(1); opacity: 0.6; }
            100% { transform: translateY(-150px) scale(3); opacity: 0; }
        }

        @media (max-width: 768px) {
            .timer { font-size: 40px; }
            .timer-container { padding: 15px 25px; top: 10%; }
            .worker { width: 70px; height: 105px; }
        }
    </style>
</head>
<body>
    <div class="sky" id="sky"></div>
    <div class="smoke"></div>
    <div class="smoke"></div>
    <div class="smoke"></div>

    <div class="city">
        <svg viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax slice">
            <rect x="50" y="200" width="120" height="200" fill="#4a5568" />
            <rect x="200" y="150" width="100" height="250" fill="#2d3748" />
            <rect x="350" y="180" width="140" height="220" fill="#4a5568" />
            <rect x="550" y="120" width="90" height="280" fill="#2d3748" />
            <rect x="700" y="160" width="130" height="240" fill="#4a5568" />
            <rect x="880" y="190" width="110" height="210" fill="#2d3748" />
            <rect x="1050" y="140" width="100" height="260" fill="#4a5568" />
            <rect x="120" y="120" width="20" height="80" fill="#718096" />
            <rect x="380" y="100" width="25" height="80" fill="#718096" />
            <rect x="740" y="80" width="20" height="80" fill="#718096" />
            <rect x="1080" y="90" width="25" height="50" fill="#718096" />
            <rect x="70" y="230" width="15" height="15" fill="#f6e05e" opacity="0.8" />
            <rect x="100" y="230" width="15" height="15" fill="#f6e05e" opacity="0.6" />
            <rect x="220" y="180" width="15" height="15" fill="#f6e05e" opacity="0.7" />
            <rect x="250" y="180" width="15" height="15" fill="#f6e05e" opacity="0.5" />
            <rect x="380" y="220" width="15" height="15" fill="#f6e05e" opacity="0.8" />
            <rect x="410" y="220" width="15" height="15" fill="#f6e05e" opacity="0.6" />
            <rect x="570" y="160" width="15" height="15" fill="#f6e05e" opacity="0.7" />
            <rect x="600" y="160" width="15" height="15" fill="#f6e05e" opacity="0.5" />
            <rect x="730" y="200" width="15" height="15" fill="#f6e05e" opacity="0.8" />
            <rect x="760" y="200" width="15" height="15" fill="#f6e05e" opacity="0.6" />
            <rect x="910" y="230" width="15" height="15" fill="#f6e05e" opacity="0.7" />
            <rect x="940" y="230" width="15" height="15" fill="#f6e05e" opacity="0.5" />
            <rect x="1080" y="180" width="15" height="15" fill="#f6e05e" opacity="0.8" />
            <rect x="1110" y="180" width="15" height="15" fill="#f6e05e" opacity="0.6" />
        </svg>
    </div>

    <div class="timer-container">
        <div class="timer-label" id="timerLabel">До конца смены</div>
        <div class="timer" id="timer">00:00:00</div>
    </div>

    <div class="worker" id="worker">
        <svg viewBox="0 0 100 150">
            <rect x="25" y="70" width="50" height="60" rx="10" fill="#4a6fa5" />
            <rect x="30" y="75" width="40" height="10" fill="#3a5a8a" />
            <circle cx="50" cy="45" r="30" fill="#f5cba7" />
            <ellipse cx="50" cy="55" rx="12" ry="9" fill="#e0a87a" />
            <path d="M35 40 Q40 35 45 40" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M55 40 Q60 35 65 40" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M40 65 Q50 72 60 65" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M20 30 Q50 0 80 30 L80 35 Q50 15 20 35 Z" fill="#f1c40f" />
            <rect x="20" y="30" width="60" height="5" fill="#d4ac0d" rx="2" />
            <line x1="25" y1="80" x2="10" y2="110" stroke="#f5cba7" stroke-width="8" stroke-linecap="round"/>
            <line x1="75" y1="80" x2="90" y2="110" stroke="#f5cba7" stroke-width="8" stroke-linecap="round"/>
            <line x1="40" y1="130" x2="35" y2="145" stroke="#333" stroke-width="8" stroke-linecap="round"/>
            <line x1="60" y1="130" x2="65" y2="145" stroke="#333" stroke-width="8" stroke-linecap="round"/>
        </svg>
    </div>

    <script>
        // ===== НАСТРОЙКИ ГРАФИКА =====
        // Начало цикла: 4 ноября 2026, 00:00 (первый день — дневная смена)
        const START_DATE = new Date(2026, 10, 4, 0, 0, 0);
        const CYCLE_LENGTH = 8; // дней в цикле

        // Дни цикла с рабочими сменами:
        // 0: дневная (8-20), 1: дневная (8-20), 4: ночная (20-8), 5: ночная (20-8)
        // 2,3,6,7 — выходные/отсыпной
        const SHIFT_DAYS = {
            0: { type: 'day', startHour: 8, endHour: 20 },
            1: { type: 'day', startHour: 8, endHour: 20 },
            4: { type: 'night', startHour: 20, endHour: 8, endNextDay: true },
            5: { type: 'night', startHour: 20, endHour: 8, endNextDay: true }
        };

        const timerEl = document.getElementById('timer');
        const timerLabel = document.getElementById('timerLabel');
        const workerEl = document.getElementById('worker');
        const skyEl = document.getElementById('sky');

        // ===== ЛОГИКА =====

        // Индекс дня в цикле (0-7) для заданной даты
        function getCycleDayIndex(date) {
            const dateMidnight = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            const diffDays = Math.floor((dateMidnight - START_DATE) / (24 * 3600 * 1000));
            return ((diffDays % CYCLE_LENGTH) + CYCLE_LENGTH) % CYCLE_LENGTH;
        }

        // Возвращает интервалы смен для конкретного дня цикла (baseDate — полночь этого дня)
        function getShiftIntervalsForCycleDay(cycleDayIndex, baseDate) {
            const intervals = [];
            const shiftInfo = SHIFT_DAYS[cycleDayIndex];
            if (!shiftInfo) return intervals;

            const start = new Date(baseDate);
            start.setHours(shiftInfo.startHour, 0, 0, 0);

            let end;
            if (shiftInfo.endNextDay) {
                end = new Date(baseDate);
                end.setDate(end.getDate() + 1);
                end.setHours(shiftInfo.endHour, 0, 0, 0);
            } else {
                end = new Date(baseDate);
                end.setHours(shiftInfo.endHour, 0, 0, 0);
            }
            intervals.push({ start, end });
            return intervals;
        }

        // Главная функция: определяет, в смене ли мы, сколько осталось и какой прогресс
        function getShiftInfo(now) {
            const cycleDayIndex = getCycleDayIndex(now);
            const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            // Собираем интервалы для диапазона дней вокруг текущего (с запасом на будущее)
            const intervals = [];
            for (let offset = -2; offset <= 9; offset++) {
                const baseDate = new Date(todayMidnight);
                baseDate.setDate(baseDate.getDate() + offset);
                const idx = ((cycleDayIndex + offset) % CYCLE_LENGTH + CYCLE_LENGTH) % CYCLE_LENGTH;
                intervals.push(...getShiftIntervalsForCycleDay(idx, baseDate));
            }
            intervals.sort((a, b) => a.start - b.start);

            // 1) Проверяем, находимся ли сейчас внутри какой-то смены
            for (const interval of intervals) {
                if (now >= interval.start && now < interval.end) {
                    const timeLeft = (interval.end - now) / 1000;
                    const progress = (now - interval.start) / (interval.end - interval.start);
                    return { isActive: true, timeLeft, progress, label: 'До конца смены' };
                }
            }

            // 2) Если не в смене — ищем ближайшую будущую смену
            let nextInterval = null;
            for (const interval of intervals) {
                if (interval.start > now) {
                    nextInterval = interval;
                    break;
                }
            }
            if (nextInterval) {
                const timeLeft = (nextInterval.start - now) / 1000;
                return { isActive: false, timeLeft, progress: 0, label: 'До начала смены' };
            }

            // 3) fallback (теоретически не должен сработать)
            return { isActive: false, timeLeft: 0, progress: 0, label: 'До начала смены' };
        }

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function updateWorkerPosition(progress) {
            const workerWidth = workerEl.offsetWidth;
            const maxLeft = window.innerWidth - workerWidth;
            const left = Math.max(0, Math.min(maxLeft, progress * maxLeft));
            workerEl.style.left = left + 'px';
        }

        function updateSky(hours) {
            let gradient;
            if (hours >= 6 && hours < 12) {
                gradient = 'linear-gradient(to bottom, #87CEEB, #FFB347)';
            } else if (hours >= 12 && hours < 18) {
                gradient = 'linear-gradient(to bottom, #87CEEB, #E0F7FA)';
            } else if (hours >= 18 && hours < 22) {
                gradient = 'linear-gradient(to bottom, #FF7E5F, #2C3E50)';
            } else {
                gradient = 'linear-gradient(to bottom, #0B0B2B, #1B1B3A)';
            }
            skyEl.style.background = gradient;
        }

        function update() {
            const now = new Date();
            const info = getShiftInfo(now);

            timerEl.textContent = formatTime(info.timeLeft);
            timerLabel.textContent = info.label;
            updateWorkerPosition(info.progress);
            updateSky(now.getHours());
        }

        update();
        setInterval(update, 1000);

        window.addEventListener('resize', () => {
            const now = new Date();
            const info = getShiftInfo(now);
            updateWorkerPosition(info.progress);
        });
    </script>
</body>
</html>
