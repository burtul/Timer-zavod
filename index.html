<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a6fa5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>До конца смены</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --primary: #4a6fa5;
    --primary-dark: #2d3748;
    --secondary: #f5cba7;
    --accent: #f1c40f;
    --text-light: #ffffff;
    --text-dark: #1a202c;
    --glass-bg: rgba(255, 255, 255, 0.15);
    --glass-border: rgba(255, 255, 255, 0.3);
    --shadow-glow: 0 0 30px rgba(74, 111, 165, 0.5);
  }

  body {
    overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh;
    height: 100dvh;
    width: 100vw;
    position: relative;
    background: linear-gradient(135deg, #1a237e 0%, #3949ab 50%, #4a6fa5 100%);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    cursor: default;
    color: var(--text-light);
  }

  /* Animated Background */
  .sky {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #1a237e 0%, #3949ab 50%, #4a6fa5 100%);
    transition: background 3s ease;
    z-index: 1;
    overflow: hidden;
  }

  .sky::before {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
  }

  .stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    animation: twinkle 4s infinite ease-in-out;
    opacity: 0.6;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* Cityscape - Improved */
  .city {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 50%;
    z-index: 2;
    pointer-events: none;
  }

  .city svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Floating particles - Enhanced */
  .smoke {
    position: fixed;
    bottom: 50%;
    left: 15%;
    width: 16px;
    height: 16px;
    background: rgba(200, 200, 200, 0.45);
    border-radius: 50%;
    animation: smokeRise 5s infinite ease-out;
    z-index: 3;
    filter: blur(2px);
  }

  .smoke:nth-child(2) {
    left: 45%;
    width: 20px;
    height: 20px;
    animation-delay: 1.5s;
    background: rgba(200, 200, 200, 0.55);
  }

  .smoke:nth-child(3) {
    left: 75%;
    width: 12px;
    height: 12px;
    animation-delay: 2.5s;
    background: rgba(200, 200, 200, 0.4);
  }

  .smoke:nth-child(4) {
    left: 30%;
    width: 18px;
    height: 18px;
    animation-delay: 0.8s;
    background: rgba(200, 200, 200, 0.5);
  }

  .smoke:nth-child(5) {
    left: 60%;
    width: 14px;
    height: 14px;
    animation-delay: 2s;
    background: rgba(200, 200, 200, 0.45);
  }

  @keyframes smokeRise {
    0% {
      transform: translateY(0) scale(1);
      opacity: 0.5;
    }
    100% {
      transform: translateY(-200px) scale(2.5);
      opacity: 0;
    }
  }

  /* Timer Container - Modern Glassmorphism */
  .timer-container {
    position: fixed;
    top: 15%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 28px 48px;
    border-radius: 24px;
    box-shadow: 
      0 20px 60px rgba(0, 0, 0, 0.3),
      var(--shadow-glow);
    border: 1px solid var(--glass-border);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    min-width: 280px;
  }

  .timer-container:hover {
    transform: translateX(-50%) translateY(-5px);
    box-shadow: 
      0 25px 80px rgba(0, 0, 0, 0.4),
      0 0 40px rgba(74, 111, 165, 0.6);
  }

  .timer-label {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.85);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
  }

  .timer-display {
    font-size: 72px;
    font-weight: 800;
    color: var(--text-light);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -2px;
  }

  /* Progress Bar */
  .progress-container {
    position: fixed;
    top: 28%;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    max-width: 500px;
    z-index: 9;
    opacity: 0.8;
  }

  .progress-bar {
    height: 4px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 2px;
    overflow: hidden;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--secondary), var(--primary));
    border-radius: 2px;
    transition: width 0.5s ease-out;
    box-shadow: 0 0 15px rgba(241, 196, 15, 0.5);
  }

  /* Date Display */
  .date-container {
    position: fixed;
    top: 32%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 8;
    opacity: 0.7;
  }

  .date-text {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.75);
    font-weight: 400;
    letter-spacing: 1px;
  }

  /* Worker - Enhanced */
  .worker {
    position: fixed;
    bottom: 3%;
    left: 0;
    width: clamp(100px, 15vw, 150px);
    height: auto;
    z-index: 5;
    transition: left 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.4));
  }

  .worker svg {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Status Indicator */
  .status-indicator {
    position: fixed;
    top: 8%;
    right: 5%;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #4caf50;
    z-index: 20;
    box-shadow: 0 0 15px #4caf50;
    animation: pulse 2s infinite;
  }

  .status-indicator.paused {
    background: #f44336;
    box-shadow: 0 0 15px #f44336;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.2); opacity: 0.8; }
  }

  /* Current Time */
  .current-time {
    position: fixed;
    top: 8%;
    left: 5%;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.65);
    font-weight: 400;
    z-index: 20;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.5px;
  }

  /* Responsive Design */
  @media (max-width: 768px) {
    .timer-display {
      font-size: 48px;
    }
    
    .timer-container {
      padding: 20px 36px;
      top: 12%;
      min-width: 240px;
    }
    
    .timer-label {
      font-size: 12px;
      margin-bottom: 10px;
    }
    
    .progress-container {
      top: 25%;
      width: 90%;
    }
    
    .date-container {
      top: 29%;
    }
    
    .date-text {
      font-size: 12px;
    }
    
    .current-time {
      font-size: 11px;
      left: 3%;
    }
    
    .status-indicator {
      width: 10px;
      height: 10px;
      top: 6%;
      right: 4%;
    }
    
    .city {
      height: 45%;
    }
    
    .worker {
      bottom: 2%;
    }
  }

  @media (max-width: 480px) {
    .timer-display {
      font-size: 36px;
    }
    
    .timer-container {
      padding: 16px 28px;
      top: 10%;
      min-width: 200px;
    }
    
    .progress-container {
      top: 22%;
      width: 95%;
    }
    
    .date-container {
      top: 26%;
    }
    
    .date-text {
      font-size: 10px;
    }
  }

  /* Loading Animation */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .timer-container,
  .progress-container,
  .date-container,
  .current-time,
  .status-indicator {
    animation: fadeIn 0.8s ease-out;
  }
</style>
</head>

<script>
  // Configuration
  const START_DATE = new Date(2026, 10, 4, 0, 0, 0);
  const CYCLE = 8;
  const SHIFT_DAYS = {
    0: { s: 8, e: 20 },
    1: { s: 8, e: 20 },
    4: { s: 20, e: 8, nd: true },
    5: { s: 20, e: 8, nd: true }
  };

  // DOM Elements
  const timerEl = document.getElementById('timer');
  const timerLabel = document.getElementById('timerLabel');
  const workerEl = document.getElementById('worker');
  const skyEl = document.getElementById('sky');
  const progressFill = document.getElementById('progressFill');
  const dateText = document.getElementById('dateText');
  const currentTimeEl = document.getElementById('currentTime');
  const statusIndicator = document.getElementById('statusIndicator');
  const starsContainer = document.getElementById('stars');

  // Create stars
  function createStars() {
    const starCount = 100;
    for (let i = 0; i < starCount; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 60 + '%';
      star.style.animationDelay = Math.random() * 4 + 's';
      star.style.width = (Math.random() * 2 + 1) + 'px';
      star.style.height = star.style.width;
      star.style.opacity = Math.random() * 0.5 + 0.3;
      starsContainer.appendChild(star);
    }
  }

  // Get cycle day index
  function getCycleDayIndex(d) {
    const m = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const diff = Math.floor((m - START_DATE) / 864e5);
    return ((diff % CYCLE) + CYCLE) % CYCLE;
  }

  // Get intervals for a specific day
  function getIntervals(idx, base) {
    const si = SHIFT_DAYS[idx];
    if (!si) return [];
    
    const start = new Date(base);
    start.setHours(si.s, 0, 0, 0);
    
    const end = new Date(base);
    if (si.nd) end.setDate(end.getDate() + 1);
    end.setHours(si.e, 0, 0, 0);
    
    return [{ start, end }];
  }

  // Get shift information
  function getShiftInfo(now) {
    const idx = getCycleDayIndex(now);
    const tm = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const ints = [];

    for (let o = -2; o <= 9; o++) {
      const b = new Date(tm);
      b.setDate(b.getDate() + o);
      const i = ((idx + o) % CYCLE + CYCLE) % CYCLE;
      ints.push(...getIntervals(i, b));
    }

    ints.sort((a, b) => a.start - b.start);

    for (const it of ints) {
      if (now >= it.start && now < it.end) {
        return {
          isActive: true,
          timeLeft: (it.end - now) / 1000,
          progress: (now - it.start) / (it.end - it.start),
          label: 'До конца смены'
        };
      }
    }

    for (const it of ints) {
      if (it.start > now) {
        return {
          isActive: false,
          timeLeft: (it.start - now) / 1000,
          progress: 0,
          label: 'До начала смены'
        };
      }
    }

    return {
      isActive: false,
      timeLeft: 0,
      progress: 0,
      label: 'До начала смены'
    };
  }

  // Format time
  function fmt(s) {
    const h = Math.floor(s / 3600);
    const m = Math.floor(s % 3600 / 60);
    const sec = Math.floor(s % 60);
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  }

  // Update worker position
  function updWorker(p) {
    const w = workerEl.offsetWidth;
    const max = window.innerWidth - w;
    workerEl.style.left = Math.max(0, Math.min(max, p * max)) + 'px';
  }

  // Update sky based on time
  function updSky(h) {
    let gradient;
    
    if (h >= 6 && h < 12) {
      // Morning
      gradient = 'linear-gradient(135deg, #1a237e 0%, #4a6fa5 50%, #87CEEB 100%)';
    } else if (h >= 12 && h < 18) {
      // Afternoon
      gradient = 'linear-gradient(135deg, #4a6fa5 0%, #6ba3c8 50%, #87CEEB 100%)';
    } else if (h >= 18 && h < 22) {
      // Evening
      gradient = 'linear-gradient(135deg, #1a237e 0%, #3949ab 50%, #6a5acd 100%)';
    } else {
      // Night
      gradient = 'linear-gradient(135deg, #0b0b2b 0%, #1a237e 50%, #2d3748 100%)';
    }
    
    skyEl.style.background = gradient;
    
    // Adjust star visibility
    const stars = starsContainer.querySelectorAll('.star');
    if (h >= 6 && h < 20) {
      stars.forEach(star => star.style.opacity = '0.1');
    } else {
      stars.forEach(star => star.style.opacity = Math.random() * 0.5 + 0.3 + '');
    }
  }

  // Format date
  function formatDate(date) {
    const days = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
    const months = ['Января', 'Февраля', 'Марта', 'Апреля', 'Мая', 'Июня', 'Июля', 'Августа', 'Сентября', 'Октября', 'Ноября', 'Декабря'];
    
    const dayName = days[date.getDay()];
    const day = date.getDate();
    const monthName = months[date.getMonth()];
    const year = date.getFullYear();
    
    return `${dayName}, ${day} ${monthName} ${year}`;
  }

  // Format current time
  function formatCurrentTime(date) {
    return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }

  // Main update function
  function update() {
    const now = new Date();
    const info = getShiftInfo(now);
    
    // Update timer
    timerEl.textContent = fmt(info.timeLeft);
    timerLabel.textContent = info.label;
    
    // Update worker position
    updWorker(info.progress);
    
    // Update progress bar
    progressFill.style.width = (info.progress * 100) + '%';
    
    // Update sky
    updSky(now.getHours());
    
    // Update date
    dateText.textContent = formatDate(now);
    
    // Update current time
    currentTimeEl.textContent = formatCurrentTime(now);
    
    // Update status indicator
    if (info.isActive) {
      statusIndicator.classList.remove('paused');
    } else {
      statusIndicator.classList.add('paused');
    }
  }

  // Initialize
  createStars();
  update();
  
  // Update every second
  setInterval(update, 1000);
  
  // Handle resize
  window.addEventListener('resize', () => {
    const info = getShiftInfo(new Date());
    updWorker(info.progress);
  });

  // Service Worker registration
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
